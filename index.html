<body>
<p id="m" style="font-family:system-ui,sans-serif;text-align:center;margin-top:20vh;color:#44535b">Chargement du planning…</p>
<script>
/* Charge la dernière version de la page du planning (aucune donnée ici : tout est servi après connexion). */
fetch('https://jeanmichelnizet.github.io/icoeurvisit/planning/index.html?t=' + Date.now(), { cache: 'no-store' })
  .then(function (r) { if (!r.ok) throw 0; return r.text(); })
  .then(function (h) { document.open(); document.write(h); document.close(); })
  .catch(function () { document.getElementById('m').textContent = 'Le planning ne répond pas pour le moment. Rechargez la page dans un instant.'; });
</script>
</body>
